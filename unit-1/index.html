<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unit 1 — Where Are You From? | English Acquisition Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary-red:#E31B23;
  --primary-red-hover:#C6131B;
  --header-gradient: linear-gradient(135deg, #E31B23 0%, #C2185B 50%, #8E24AA 100%);
  --soft-peach:#FFEBE6;
  --card-cream:#FFF9E6;
  --surface-white:#FFFFFF;
  --surface-light:#F4F5F7;
  --text-main:#212121;
  --text-muted:#757575;
  --border-line:#E0D6C8;
  --success-green:#2E7D32;
  --success-bg:#E8F5E9;
  --error-red:#D32F2F;
  --error-bg:#FFEBEE;
  --star-gold:#FFA000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{height:-webkit-fill-available;}
body{
  min-height:100vh;
  min-height:100dvh;
  background:var(--surface-light);
  font-family:'Source Sans 3', sans-serif;
  color:var(--text-main);
  display:flex;
  justify-content:center;
  padding:0 0 env(safe-area-inset-bottom, 24px);
  -webkit-overflow-scrolling:touch;
}
.wrap{width:100%;max-width:900px;}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;touch-action:manipulation;}
input,textarea{touch-action:manipulation;}

/* ---------- HEADER ---------- */
.app-header{
  background:var(--header-gradient);
  color:#fff;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 16px;
  border-radius:0 0 18px 18px;
  margin-bottom:14px;
  box-shadow:0 8px 24px rgba(142,36,170,0.25);
  cursor:pointer;
}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.header-title{
  font-weight:800;font-style:italic;letter-spacing:.4px;
  font-size:clamp(19px,5vw,26px);line-height:1;
}
.header-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;opacity:.85;margin-top:4px;}
.review-shortcut{
  background:rgba(255,255,255,0.18);border:none;color:#fff;border-radius:20px;
  padding:7px 12px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;
}
.review-shortcut .nb{background:#fff;color:var(--primary-red);border-radius:10px;padding:0 6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;}
.header-progress-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
.header-progress{flex:1;background:rgba(255,255,255,0.25);border-radius:10px;height:8px;overflow:hidden;}
.header-progress-fill{background:#fff;height:100%;border-radius:10px;transition:width .3s;}
.header-progress-pct{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.9;}

/* ---------- SHELL ---------- */
.app-shell{padding:0 14px;}
.main-card{
  background:var(--surface-white);border-radius:16px;border:1px solid var(--border-line);
  box-shadow:0 8px 22px rgba(0,0,0,0.06);padding:20px 18px 24px;min-height:400px;
}
.module-title{font-size:clamp(19px,4.4vw,24px);font-weight:800;color:var(--text-main);display:flex;align-items:center;gap:8px;}
.module-desc{color:var(--text-muted);font-size:13.5px;margin-top:4px;margin-bottom:16px;line-height:1.5;}

.back-bar{
  background:none;border:none;color:var(--primary-red);font-weight:700;font-size:13.5px;
  padding:0 0 14px;cursor:pointer;display:flex;align-items:center;gap:5px;
}
.back-bar:hover{text-decoration:underline;}

/* ---------- BUTTONS ---------- */
.btn{
  border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid transparent;
  font-family:'Source Sans 3',sans-serif;
}
.btn-primary{background:var(--primary-red);color:#fff;}
.btn-primary:hover{background:var(--primary-red-hover);}
.btn-primary:disabled{opacity:.45;cursor:default;}
.btn-ghost{background:#fff;border-color:var(--border-line);color:var(--text-main);}
.btn-ghost:hover{border-color:var(--primary-red);color:var(--primary-red);}
.btn-ghost.active{background:var(--header-gradient);color:#fff;border-color:transparent;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.icon-btn{background:none;border:1px solid var(--border-line);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
.icon-btn:hover{border-color:var(--primary-red);color:var(--primary-red);}
.icon-btn.star.active{color:var(--star-gold);border-color:var(--star-gold);}

/* ---------- HUB PORTALS ---------- */
.quickstart{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--header-gradient);color:#fff;border:none;border-radius:14px;
  padding:16px;font-size:16px;font-weight:800;font-family:'Barlow Condensed',sans-serif;
  letter-spacing:.3px;cursor:pointer;margin-bottom:18px;box-shadow:0 6px 16px rgba(227,27,35,0.25);
}
.portal-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media (min-width:600px){ .portal-grid{grid-template-columns:1fr 1fr;} }
.portal-card{
  text-align:left;background:var(--card-cream);border:1px solid var(--border-line);border-radius:14px;
  padding:18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;position:relative;
}
.portal-card:hover{border-color:var(--primary-red);}
.portal-card .em{font-size:30px;}
.portal-card b{display:block;font-size:16.5px;color:var(--text-main);}
.portal-card span{font-size:12.5px;color:var(--text-muted);line-height:1.4;display:block;margin-top:3px;}
.portal-card .pb{position:absolute;top:12px;right:12px;background:var(--primary-red);color:#fff;border-radius:10px;font-size:10.5px;padding:2px 8px;font-family:'IBM Plex Mono',monospace;}

/* ---------- STUDY PATH ---------- */
.path-list{display:flex;flex-direction:column;gap:10px;}
.path-card{
  background:#fff;border:1.5px solid var(--border-line);border-radius:14px;padding:14px 16px;
  display:flex;gap:12px;align-items:center;cursor:pointer;
}
.path-card:hover{border-color:var(--primary-red);}
.path-card.done{border-color:var(--success-green);}
.path-card .em{font-size:26px;flex-shrink:0;}
.path-card .pc-main{flex:1;min-width:0;}
.path-card b{font-size:15px;}
.path-card .pc-desc{font-size:12px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
.path-card .pc-status{font-size:11px;font-family:'IBM Plex Mono',monospace;margin-top:6px;color:var(--text-muted);}
.path-card .pc-status.done{color:var(--success-green);font-weight:700;}
.path-card .pc-status.progress{color:var(--primary-red);font-weight:700;}
.mini-bar{background:var(--surface-light);border-radius:6px;height:6px;overflow:hidden;margin-top:6px;}
.mini-bar > div{background:var(--primary-red);height:100%;}
.path-card.done .mini-bar > div{background:var(--success-green);}
.check-badge{font-size:18px;color:var(--success-green);flex-shrink:0;}

/* ---------- EXERCISE CARD ---------- */
.ex-progress{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-muted);margin-bottom:8px;display:flex;justify-content:space-between;}
.instr-box{
  background:var(--soft-peach);border-left:4px solid var(--primary-red);border-radius:8px;
  padding:12px 14px;margin-bottom:14px;font-size:14.5px;line-height:1.5;
}
.instr-box b{color:var(--primary-red);}
.target-box{
  background:var(--card-cream);border:1px solid var(--border-line);border-radius:10px;
  padding:14px 16px;margin-bottom:14px;
}
.eng-line{font-size:16.5px;font-style:italic;color:var(--text-main);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pt-line{font-size:12.5px;color:var(--text-muted);margin-top:4px;}
.audio-btn{background:var(--primary-red);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:13px;flex-shrink:0;}
.audio-btn:hover{background:var(--primary-red-hover);}

.options{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.opt-btn{
  display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:1.5px solid var(--border-line);
  border-radius:10px;padding:12px 14px;font-size:14.5px;color:var(--text-main);cursor:pointer;width:100%;
}
.opt-btn:hover:not(:disabled){border-color:var(--primary-red);}
.opt-btn.correct{background:var(--success-bg);border-color:var(--success-green);font-weight:700;}
.opt-btn.wrong{background:var(--error-bg);border-color:var(--error-red);}
.opt-btn:disabled{cursor:default;}
.opt-btn.selected{background:var(--soft-peach);border-color:var(--primary-red);}
.opt-btn .chk{font-size:15px;flex-shrink:0;}

.sound-badge-row{display:flex;justify-content:flex-end;margin-bottom:8px;}
.sound-badge-pill{
  display:inline-block;background:var(--header-gradient);color:#ffffff;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.4px;
  padding:6px 16px;border-radius:20px;box-shadow:0 4px 10px rgba(227,27,35,0.2);
}
.expand-hint{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px;white-space:nowrap;}
.expand-chevron{display:inline-block;transition:transform .2s;color:var(--primary-red);font-size:13px;}
.expand-chevron.open{transform:rotate(180deg);}
.expandable-card{cursor:pointer;}
.skill-card{border:1px solid var(--border-line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff;}
.skill-card-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:10px;cursor:pointer;}
.skill-card-body{padding:0 14px 14px;border-top:1px dashed var(--border-line);font-size:13.5px;color:var(--text-main);line-height:1.55;display:none;}
.skill-card-body.open{display:block;padding-top:10px;}
.skill-card-body b{color:var(--primary-red);}

.type-input{width:100%;border:1.5px solid var(--border-line);border-radius:10px;padding:12px 13px;font-size:16px;color:var(--text-main);-webkit-appearance:none;}
.type-input:focus{outline:none;border-color:var(--primary-red);}
textarea.type-input{min-height:70px;resize:vertical;}

.tile-bank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;min-height:44px;padding:10px;background:var(--surface-light);border-radius:10px;border:1px dashed var(--border-line);}
.tile{background:#fff;border:1.5px solid var(--border-line);border-radius:8px;padding:9px 12px;font-size:14.5px;cursor:pointer;font-weight:600;color:var(--text-main);}
.tile:hover{border-color:var(--primary-red);}
.answer-strip{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:10px;background:#fff;border:2px solid var(--border-line);border-radius:10px;margin-bottom:10px;}
.answer-strip.empty::before{content:"Toque nas palavras abaixo para montar a frase...";color:var(--text-muted);font-size:13px;}
.ans-tile{background:var(--soft-peach);border:1.5px solid var(--primary-red);border-radius:8px;padding:9px 12px;font-size:14.5px;cursor:pointer;font-weight:600;}
.blank-input{width:90px;border:1.5px solid var(--primary-red);border-radius:6px;padding:7px 8px;font-size:14px;}

.feedback{border-radius:10px;padding:14px 16px;margin-top:14px;font-size:14.5px;line-height:1.55;}
.feedback.ok{background:var(--success-bg);border:1px solid var(--success-green);}
.feedback.bad{background:var(--error-bg);border:1px solid var(--error-red);}
.feedback .fb-line{margin-bottom:4px;}
.tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;background:#fff;border:1px solid var(--border-line);border-radius:10px;padding:1px 7px;margin-left:6px;color:var(--text-muted);}

.field-group{margin-bottom:10px;}
.field-label{font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:4px;display:block;}
.dialogue-line{background:var(--card-cream);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-style:italic;font-size:14.5px;display:flex;align-items:center;gap:8px;}

.profile-card{background:var(--card-cream);border:1px solid var(--border-line);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
.profile-card .pf-row{display:flex;gap:6px;font-size:13.5px;padding:3px 0;}
.profile-card .pf-row b{min-width:120px;color:var(--text-muted);font-weight:600;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
.stat-card{background:var(--card-cream);border:1px solid var(--border-line);border-radius:12px;padding:14px;}
.stat-num{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;color:var(--primary-red);}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;}

.empty-state{text-align:center;padding:32px 10px;color:var(--text-muted);}
.empty-state .big{font-size:36px;margin-bottom:8px;}

/* ---------- CATALOG ---------- */
.search-input{width:100%;border:1.5px solid var(--border-line);border-radius:10px;padding:11px 14px;font-size:16px;margin-bottom:12px;-webkit-appearance:none;}
.chip-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
.chip{background:#fff;border:1.5px solid var(--border-line);border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-muted);white-space:nowrap;}
.chip.active{background:var(--header-gradient);color:#fff;border-color:transparent;}
.cat-item{border:1px solid var(--border-line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff;}
.cat-item-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:10px;}
.cat-item-head .ci-text{flex:1;min-width:0;}
.cat-item-head .ci-en{font-weight:700;font-size:14.5px;}
.cat-item-head .ci-pt{font-size:12px;color:var(--text-muted);margin-top:2px;}
.cat-item-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.cat-item-body{padding:0 14px 14px;border-top:1px dashed var(--border-line);font-size:13.5px;color:var(--text-main);display:none;}
.cat-item-body.open{display:block;padding-top:10px;}
.cat-item-body .arrow-line{margin-top:6px;color:var(--text-muted);}

.search-result{background:var(--card-cream);border:1px solid var(--border-line);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}

.review-item{border:1px solid var(--border-line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff;}
.badge-pill{font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--error-bg);color:var(--error-red);border-radius:10px;padding:2px 8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header" id="headerClick">
    <div class="header-top">
      <div>
        <div class="header-title">WHERE ARE YOU FROM?</div>
        <div class="header-sub">UNIT 1 · ENGLISH ACQUISITION LAB</div>
      </div>
      <button class="review-shortcut" id="reviewShortcut">🔁 Revisão <span class="nb" id="reviewBadge" style="display:none;">0</span></button>
    </div>
    <div class="header-progress-row">
      <div class="header-progress"><div class="header-progress-fill" id="hsProgFill" style="width:0%"></div></div>
      <div class="header-progress-pct" id="hsProgPct">0%</div>
    </div>
  </div>

  <div class="app-shell">
    <div class="main-card" id="mainCard"></div>
  </div>
</div>

<script>
/* =====================================================================
   DADOS
   ===================================================================== */
const PROFILES = [
  {id:"px-alexandra", first:"Alexandra", last:"Costa", nick:"Alexa", country:"Brazil", age:"24", job:"student", extra:"tennis", extraLabel:"favorite sport",
    dialogue:["My name is Alexandra Costa, but please call me Alexa.","I'm from Brazil.","I'm 24.","I'm a student.","My favorite sport is tennis."]},
  {id:"px-jay", first:"Jay", last:"Park", nick:"", country:"South Korea", age:"21", job:"student", extra:"Business", extraLabel:"favorite subject",
    dialogue:["Hi, I'm Jay Park.","I'm from South Korea.","I'm 21.","I'm a student.","My favorite subject is Business."]},
  {id:"px-soojin", first:"Soo-jin", last:"Kim", nick:"", country:"South Korea", age:"22", job:"student", extra:"Biology", extraLabel:"favorite subject",
    dialogue:["My name is Soo-jin Kim.","I'm from South Korea.","I'm 22.","I'm a student.","My favorite subject is Biology."]},
  {id:"px-maria", first:"Maria", last:"Valdez", nick:"", country:"Mexico", age:"26", job:"teacher", extra:"Literature", extraLabel:"favorite subject",
    dialogue:["My name is Maria Valdez.","I'm from Mexico.","I'm 26.","I'm a teacher.","My favorite subject is Literature."]}
];

const GOLDEN_PHRASES = [
  {id:"gp-01", en:"My name is Alexandra Costa, but please call me Alexa.", pt:"Meu nome é Alexandra Costa, mas por favor me chame de Alexa.", cat:"Apresentação"},
  {id:"gp-02", en:"Everyone calls me Bill.", pt:"Todo mundo me chama de Bill.", cat:"Apresentação"},
  {id:"gp-03", en:"What do people call you?", pt:"Como as pessoas costumam te chamar?", cat:"Perguntas"},
  {id:"gp-04", en:"How about you?", pt:"E você?", cat:"Conversa"},
  {id:"gp-05", en:"So, you're from South Korea?", pt:"Então, você é da Coreia do Sul?", cat:"Confirmação"},
  {id:"gp-06", en:"That's right.", pt:"Isso mesmo.", cat:"Confirmação"},
  {id:"gp-07", en:"I'm sorry. What's your last name again?", pt:"Desculpe. Qual é o seu sobrenome mesmo?", cat:"Repetição"},
  {id:"gp-08", en:"How do you spell that?", pt:"Como se soletra isso?", cat:"Soletração"},
  {id:"gp-09", en:"Actually, it's Valdez.", pt:"Na verdade, é Valdez.", cat:"Correção"},
  {id:"gp-10", en:"Can you say that again?", pt:"Você pode repetir isso?", cat:"Repetição"},
  {id:"gp-11", en:"What's Seoul like?", pt:"Como é Seul?", cat:"Descrição"},
  {id:"gp-12", en:"It's a very exciting city.", pt:"É uma cidade muito animada.", cat:"Descrição"},
  {id:"gp-13", en:"What are your classmates like?", pt:"Como são os seus colegas de classe?", cat:"Descrição"},
  {id:"gp-14", en:"They're shy, but very friendly.", pt:"Eles são tímidos, mas muito simpáticos.", cat:"Descrição"},
  {id:"gp-15", en:"Let's go and say hello.", pt:"Vamos lá cumprimentar.", cat:"Conversa"},
  {id:"gp-16", en:"How's it going?", pt:"Como vai?", cat:"Saudação"},
  {id:"gp-17", en:"Pretty good, thanks.", pt:"Bem legal, obrigado(a).", cat:"Saudação"},
  {id:"gp-18", en:"Do you have time for coffee?", pt:"Você tem tempo para um café?", cat:"Convite"},
  {id:"gp-19", en:"Sure. I'd love some coffee.", pt:"Claro. Eu adoraria um café.", cat:"Convite"},
  {id:"gp-20", en:"Have a good day.", pt:"Tenha um bom dia.", cat:"Despedida"},
  {id:"gp-21", en:"Thank you. You, too.", pt:"Obrigado(a). Você também.", cat:"Despedida"},
  {id:"gp-22", en:"What's up?", pt:"E aí, tudo bem?", cat:"Saudação"},
  {id:"gp-23", en:"Oh, not much.", pt:"Ah, nada de mais.", cat:"Saudação"},
  {id:"gp-24", en:"Good morning.", pt:"Bom dia.", cat:"Saudação"},
  {id:"gp-25", en:"Good night.", pt:"Boa noite.", cat:"Despedida"},
  {id:"gp-26", en:"See you later.", pt:"Até mais.", cat:"Despedida"},
  {id:"gp-27", en:"Talk to you later.", pt:"Falo com você depois.", cat:"Despedida"}
];

const COLLOCATIONS = [
  {id:"col-01", prompt:"She works ___ a living.", options:["for","of","at","in"], answer:"for", full:"work for a living", note:"Usamos “for a living” para dizer qual é a profissão de alguém.", ex:"What do you do for a living?", exPt:"O que você faz para viver / qual é a sua profissão?"},
  {id:"col-02", prompt:"I'm in the same class ___ Soo-jin.", options:["with","as","of","for"], answer:"as", full:"in the same class as", note:"Usamos “the same ___ as” para comparar/igualar duas coisas.", ex:"I'm in the same class as Jay.", exPt:"Eu estou na mesma turma que o Jay."},
  {id:"col-03", prompt:"See you ___ the morning.", options:["at","on","in","for"], answer:"in", full:"in the morning", note:"Usamos “in the morning/afternoon” mas “at night”.", ex:"I have class in the morning.", exPt:"Eu tenho aula de manhã."},
  {id:"col-04", prompt:"I'll see you ___ 8:00.", options:["in","on","at","for"], answer:"at", full:"at 8:00", note:"Usamos “at” com horários específicos.", ex:"The meeting is at 8:00.", exPt:"A reunião é às 8:00."},
  {id:"col-05", prompt:"She's ___ vacation this week.", options:["at","in","on","for"], answer:"on", full:"on vacation", note:"A expressão fixa é “on vacation”.", ex:"They're on vacation in Brazil.", exPt:"Eles estão de férias no Brasil."},
  {id:"col-06", prompt:"Wait for me ___ there.", options:["over","on","at","in"], answer:"over", full:"over there", note:"“Over there” indica um lugar à distância, apontando.", ex:"My friend is over there.", exPt:"Meu amigo está ali."}
];

/* ---- ASKING QUESTIONS (build the sentence) ---- */
const BUILD_ITEMS = [
  {id:"bts-01", situation:"Pergunte de onde alguém é.", target:"Where are you from?"},
  {id:"bts-02", situation:"Pergunte a idade de alguém.", target:"How old are you?"},

/* =====================================================================
   UTILITÁRIOS
   ===================================================================== */
function normalize(s){
  return (s||"").toLowerCase().trim()
    .replace(/[.,!?;:"“”'’]/g,"")
    .replace(/\s+/g," ");
}
function acceptedMatch(input, acceptedList){
  const n = normalize(input);
  if(!n) return false;
  return acceptedList.some(function(a){ return normalize(a) === n; });
}
function looseContains(input, needles){
  const n = normalize(input);
  if(needles.length===0) return n.length>1;
  return needles.some(function(k){ return n.indexOf(normalize(k)) !== -1; });
}
let chosenVoice = null;
function pickVoice(){
  try{
    if(!window.speechSynthesis) return null;
    const voices = window.speechSynthesis.getVoices();
    if(!voices || !voices.length) return null;
    const en = voices.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf("en")===0; });
    if(!en.length) return null;
    /* 1) Vozes aprimoradas do ecossistema Apple/iOS (e equivalentes desktop) */
    const priorityTerms = ["premium","enhanced","siri","ava","samantha","alex","natural","neural","google"];
    let pref = en.find(function(v){
      const name = (v.name||"").toLowerCase();
      return priorityTerms.some(function(t){ return name.indexOf(t)!==-1; });
    });
    /* 2) Voz padrão en-US / en_US */
    if(!pref) pref = en.find(function(v){ const l=v.lang.toLowerCase(); return l==="en-us" || l==="en_us"; });
    /* 3) Fallback seguro: primeira voz em inglês disponível */
    if(!pref) pref = en[0];
    return pref || null;
  }catch(e){ return null; }
}
try{
  if(window.speechSynthesis){
    chosenVoice = pickVoice();
    window.speechSynthesis.onvoiceschanged = function(){ try{ chosenVoice = pickVoice(); }catch(e){} };
  }
}catch(e){}
function speak(text){
  if(!text) return;
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.95;
    if(!chosenVoice) chosenVoice = pickVoice();
    if(chosenVoice) u.voice = chosenVoice;
    window.speechSynthesis.speak(u);
  }catch(e){ /* iOS pode bloquear síntese fora de gesto do usuário — falha silenciosa */ }
}
function audioBtn(text){
  return '<button class="audio-btn" data-speak="'+escapeAttr(text)+'" title="ouvir">🔊</button>';
}
function escapeAttr(s){ return (s||"").replace(/"/g,"&quot;"); }
function wireAudioButtons(root){
  (root||document).querySelectorAll("[data-speak]").forEach(function(b){
    b.addEventListener("click",function(e){ e.stopPropagation(); speak(b.getAttribute("data-speak")); });
  });
}

function getProgress(id){
  if(!state.progress[id]) state.progress[id] = {seen:0,correct:0,wrong:0,level:1};
  return state.progress[id];
}
function addXP(n){ state.xp += n; saveState(); }
function registerResult(id, correct){
  const p = getProgress(id);
  p.seen++;
  if(correct){ p.correct++; state.streak++; if(state.streak>state.bestStreak) state.bestStreak=state.streak; addXP(10); p.level = Math.min(5,(p.level||1)+1); }
  else { p.wrong++; state.streak=0; p.level = p.level||1; }
  saveState();
}
function pushError(itemId, moduleKey, label, errorType, wrongText, correctText){
  const existing = state.reviewQueue.find(function(r){ return r.itemId===itemId; });
  if(existing){ existing.tries=(existing.tries||1)+1; existing.ts=Date.now(); existing.module=moduleKey; }
  else { state.reviewQueue.push({id:"rev-"+itemId+"-"+Date.now(), itemId:itemId, module:moduleKey, label:label, errorType:errorType, ts:Date.now(), tries:1}); }
  state.errors.unshift({itemId:itemId, module:moduleKey, label:label, errorType:errorType, wrongText:wrongText, correctText:correctText, ts:Date.now()});
  state.errors = state.errors.slice(0,40);
  saveState();
}
function removeFromReview(itemId){
  state.reviewQueue = state.reviewQueue.filter(function(r){ return r.itemId!==itemId; });
  saveState();
}
function toggleFavorite(id){
  const i = state.favorites.indexOf(id);
  if(i>=0) state.favorites.splice(i,1); else state.favorites.push(id);
  saveState();
}
function isFav(id){ return state.favorites.indexOf(id) !== -1; }
function markPhraseViewed(id){
  if(!state.viewedPhrases) state.viewedPhrases=[];
  if(state.viewedPhrases.indexOf(id)===-1){ state.viewedPhrases.push(id); saveState(); }
}

/* =====================================================================
   PROGRESSO POR MÓDULO
   ===================================================================== */
function moduleIds(key){
  switch(key){
    case "essential": return GOLDEN_PHRASES.map(function(p){return p.id;});
    case "pronunciation": return SOUND_POOL.map(function(s){return s.id;});
    case "asking": return BUILD_ITEMS.map(function(b){return b.id;});
    case "listening": return LISTEN_ITEMS.map(function(l){return l.id;});
    case "whatwasq": return QM_PAIRS.map(function(q){return q.id;});
    case "introducing": { var ids=[]; PROFILES.forEach(function(p){ ids.push(p.id+"-rec"); ids.push(p.id+"-intro"); }); return ids; }
    case "keepgoing": return WWS_ITEMS.map(function(w){return w.id;});
    case "clarifying": return FIX_ITEMS.map(function(f){return f.id;});
    case "meetsomeone": return LADDER_STEPS.map(function(s){return s.id;});
    default: return [];
  }
}
function moduleProgress(key){
  if(key==="essential"){
    const total = GOLDEN_PHRASES.length;
    const done = Math.min((state.viewedPhrases||[]).length, total);
    return {done:done, total:total, pct: total? Math.round(100*done/total):0};
  }
  if(key==="pronunciation"){
    return {done: state.pronunciationCompleted?10:0, total:10, pct: state.pronunciationCompleted?100:0};
  }
  const ids = moduleIds(key);
  const done = ids.filter(function(id){ return state.progress[id] && state.progress[id].correct>0; }).length;
  return {done:done, total:ids.length, pct: ids.length? Math.round(100*done/ids.length):0};
}
function overallProgress(){
  let doneSum=0, totalSum=0;
  MODULES_META.forEach(function(m){ const p=moduleProgress(m.key); doneSum+=p.done; totalSum+=p.total; });
  return totalSum? Math.round(100*doneSum/totalSum):0;
}
function computeStats(){
  const ids = Object.keys(state.progress);
  let correct=0, wrong=0, seen=0;
  ids.forEach(function(id){ const p=state.progress[id]; correct+=p.correct; wrong+=p.wrong; seen+=p.seen; });
  const accuracy = seen>0 ? Math.round(100*correct/(correct+wrong||1)) : 0;
  return {accuracy:accuracy, seen:seen};
}

/* ---- ASKING QUESTIONS (build the sentence) ---- */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function renderAsking(el){
  if(sessionState.idx===undefined){ sessionState.idx=0; sessionState.order = shuffle(BUILD_ITEMS.map(function(_,i){return i;})); sessionState.correctCount=0; }
  if(sessionState.idx >= sessionState.order.length){ return moduleSummary(el, "🧩 Asking Questions", "asking", sessionState.correctCount, BUILD_ITEMS.length); }
  const item = BUILD_ITEMS[sessionState.order[sessionState.idx]];
  const p = getProgress(item.id);
  if(!sessionState.built){ sessionState.built = buildTileSetup(item, p.level||1); }
  const setup = sessionState.built;
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="module-title">🧩 Asking Questions</div>
    <div class="ex-progress"><span>Item ${sessionState.idx+1} / ${sessionState.order.length}</span><span class="mono">Nível ${p.level||1}/5</span></div>
    <div class="instr-box"><b>Situação:</b> ${item.situation}</div>
    <div id="buildArea"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="checkBtn">Verificar</button>
      <button class="btn btn-ghost" id="clearBtn">Limpar</button>
      <button class="btn btn-ghost" id="skipBtn" style="display:none;">Próxima frase ▶</button>
    </div>
    <div id="fbArea"></div>
  `;
  el.appendChild(wrap);
  renderBuildArea();
  document.getElementById("clearBtn").addEventListener("click", function(){ sessionState.built = buildTileSetup(item, p.level||1); renderBuildArea(); document.getElementById("fbArea").innerHTML=""; });
  document.getElementById("checkBtn").addEventListener("click", function(){ checkBuildAnswer(item); });

  function renderBuildArea(){
    const area = document.getElementById("buildArea");
    if(setup.mode==="type-all"){
      area.innerHTML = '<input type="text" class="type-input" id="typeAllInput" placeholder="Digite a frase completa em inglês..." autocomplete="off">';
      return;
    }
    const answerHtml = setup.answer.length===0 ? "" : setup.answer.map(function(t,i){
      if(t.type==="blank") return '<input type="text" class="blank-input" data-blank-idx="'+i+'" value="'+escapeAttr(t.typed||'')+'" placeholder="?">';
      return '<span class="ans-tile" data-remove-idx="'+i+'">'+t.word+'</span>';
    }).join("");
    area.innerHTML = `
      <div class="answer-strip ${setup.answer.length===0?'empty':''}" id="answerStrip">${answerHtml}</div>
      <div class="tile-bank" id="tileBank">${setup.bank.map(function(t,i){ return t.used?"":'<span class="tile" data-tile-idx="'+i+'">'+(t.type==='blank' ? '✏️ ___' : t.word)+'</span>'; }).join("")}</div>
    `;
    area.querySelectorAll("[data-tile-idx]").forEach(function(t){
      t.addEventListener("click", function(){
        const idx = +t.dataset.tileIdx;
        setup.bank[idx].used = true;
        setup.answer.push(Object.assign({}, setup.bank[idx]));
        renderBuildArea();
      });
    });
    area.querySelectorAll("[data-remove-idx]").forEach(function(t){
      t.addEventListener("click", function(){
        const idx = +t.dataset.removeIdx;
        const removed = setup.answer.splice(idx,1)[0];
        const bankItem = setup.bank.find(function(b){ return b.used && b.word===removed.word && b.type===removed.type; });
        if(bankItem) bankItem.used = false;
        renderBuildArea();
      });
    });
    area.querySelectorAll("[data-blank-idx]").forEach(function(inp){
      inp.addEventListener("input", function(){
        const idx = +inp.dataset.blankIdx;
        setup.answer[idx].typed = inp.value;
      });
    });
  }
  function checkBuildAnswer(item){
    let assembled;
    if(setup.mode==="type-all"){
      assembled = document.getElementById("typeAllInput").value;
    } else {
      assembled = setup.answer.map(function(t){ return t.type==="blank" ? (t.typed||"") : t.word; }).join(" ");
    }
    const correct = normalize(assembled) === normalize(item.target);
    registerResult(item.id, correct);
    if(correct) sessionState.correctCount++;
    const fb = document.getElementById("fbArea");
    if(correct){
      removeFromReview(item.id);
      fb.innerHTML = `<div class="feedback ok"><div class="fb-line">✅ Muito bem! <b>${item.target}</b></div><div class="fb-line">🔊 ${audioBtn(item.target)} 🇧🇷 ${item.situation}</div></div>`;
    } else {
      pushError(item.id,"asking",item.situation,"QUESTION_ORDER",assembled,item.target);
      fb.innerHTML = `<div class="feedback bad">
        <div class="fb-line">❌ Você escreveu: “${assembled||'(vazio)'}”</div>
        <div class="fb-line">✅ Melhor: <b>${item.target}</b> ${audioBtn(item.target)}</div>
        <div class="fb-line">💡 Confira a ordem das palavras e a forma do verbo be.</div>
        <span class="tag">QUESTION_ORDER</span>
      </div>`;
    }
    wireAudioButtons(fb);
    document.getElementById("checkBtn").disabled = true;
    document.getElementById("skipBtn").style.display = "inline-block";
    document.getElementById("skipBtn").addEventListener("click", function(){ sessionState.idx++; sessionState.built=null; render(); });
  }
}
function buildTileSetup(item, level){
  const words = item.target.split(" ");
  if(level>=5){ return {mode:"type-all", answer:[]}; }
  let hideCount = Math.max(0, Math.min(level-1, words.length-1));
  const idxs = shuffle(words.map(function(_,i){return i;})).slice(0,hideCount);
  const tiles = words.map(function(w,i){ return idxs.indexOf(i)!==-1 ? {type:"blank", word:w, used:false, typed:""} : {type:"word", word:w, used:false}; });
  return {mode:"tiles", bank: shuffle(tiles.map(function(t){ return Object.assign({},t); })), answer:[]};
}

  function renderIntro(profile){

    document.getElementById("profArea").innerHTML = `

      <div class="btn-row"><button class="btn btn-primary" id="checkIntroBtn">Verificar</button></div>
    `;
    document.getElementById("checkIntroBtn").addEventListener("click", function(){

/* ---- PRONUNCIATION & LINKING ---- */
/* Engine: sorteia 10 itens entre os 20 do pool a cada rodada. Itens com mais de
   uma resposta correta usam seleção múltipla (checkboxes) + botão "Verificar".
   Ao concluir o 10º item, o módulo é marcado como concluído (100%) de forma
   persistente; "Reiniciar" apenas sorteia uma nova rodada, sem desfazer a conclusão. */
function getBalancedSoundRound(){
  const cv = shuffle(SOUND_POOL.filter(function(i){ return i.cat==="Consoante → Vogal"; })).slice(0,3);
  const ss = shuffle(SOUND_POOL.filter(function(i){ return i.cat==="Mesmo Som"; })).slice(0,3);
  const ft = shuffle(SOUND_POOL.filter(function(i){ return i.cat==="Flap T"; })).slice(0,2);
  const se = shuffle(SOUND_POOL.filter(function(i){ return i.cat==="Silent E"; })).slice(0,2);
  return shuffle(cv.concat(ss, ft, se));
}
function renderPronunciation(el){
  if(!sessionState.roundItems){
    sessionState.roundItems = getBalancedSoundRound();
    sessionState.idx = 0; sessionState.correctCount = 0;
  }
  if(sessionState.idx >= sessionState.roundItems.length){
    if(!state.pronunciationCompleted){ state.pronunciationCompleted = true; saveState(); }
    return moduleSummary(el, "🔊 Pronunciation & Linking", "pronunciation", sessionState.correctCount, sessionState.roundItems.length);
  }
  const item = sessionState.roundItems[sessionState.idx];
  if(!sessionState.currentOptions) sessionState.currentOptions = shuffle(item.options.slice());
  const shuffledOptions = sessionState.currentOptions;
  const isMulti = item.correct.length > 1;
  if(!sessionState.multiSelected) sessionState.multiSelected = [];
  const showBadge = item.stimulusType === "sentence";
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="module-title">🔊 Pronunciation & Linking</div>
    <div class="ex-progress"><span>Item ${sessionState.idx+1} / ${sessionState.roundItems.length}</span></div>
    <div class="target-box"><div class="eng-line">${item.stimulus} ${audioBtn(item.stimulus)}</div></div>
    ${showBadge ? '<div class="sound-badge-row"><span class="sound-badge-pill">'+item.badge+'</span></div>' : ''}
    <div class="instr-box"><b>${item.command}</b>${isMulti?' <span class="pt-line">(pode haver mais de uma resposta certa)</span>':''}</div>
    <div class="options" id="soundOptions">${shuffledOptions.map(function(o){
      return isMulti
        ? '<button class="opt-btn" data-opt="'+escapeAttr(o)+'"><span class="chk">☐</span> '+o+'</button>'
        : '<button class="opt-btn" data-opt="'+escapeAttr(o)+'">'+o+'</button>';
    }).join("")}</div>
    ${isMulti ? '<div class="btn-row"><button class="btn btn-primary" id="verifyMultiBtn">Verificar</button></div>' : ''}
    <div id="fbArea"></div>
  `;
  el.appendChild(wrap);
  wireAudioButtons(el);
  const optButtons = el.querySelectorAll("#soundOptions .opt-btn");

  if(isMulti){
    optButtons.forEach(function(b){
      b.addEventListener("click", function(){
        const val = b.dataset.opt;
        const i = sessionState.multiSelected.indexOf(val);
        if(i===-1){ sessionState.multiSelected.push(val); b.classList.add("selected"); b.querySelector(".chk").textContent="☑"; }
        else { sessionState.multiSelected.splice(i,1); b.classList.remove("selected"); b.querySelector(".chk").textContent="☐"; }
      });
    });
    document.getElementById("verifyMultiBtn").addEventListener("click", function(){
      optButtons.forEach(function(b){ b.disabled = true; });
      const chosenSet = sessionState.multiSelected.slice();
      const correctSet = item.correct;
      const isCorrect = chosenSet.length===correctSet.length && chosenSet.every(function(v){ return correctSet.indexOf(v)!==-1; });
      optButtons.forEach(function(b){
        const val = b.dataset.opt;
        const wasSelected = chosenSet.indexOf(val)!==-1;
        const isRight = correctSet.indexOf(val)!==-1;
        if(isRight) b.classList.add("correct");
        else if(wasSelected) b.classList.add("wrong");
      });
      finishSoundItem(isCorrect);
    });
  } else {
    optButtons.forEach(function(b){
      b.addEventListener("click", function(){
        optButtons.forEach(function(x){ x.disabled=true; });
        const val = b.dataset.opt;
        const correct = item.correct.indexOf(val)!==-1;
        b.classList.add(correct?"correct":"wrong");
        if(!correct){
          const rightBtn = [].slice.call(optButtons).find(function(x){ return x.dataset.opt===item.correct[0]; });
          if(rightBtn) rightBtn.classList.add("correct");
        }
        finishSoundItem(correct);
      });
    });
  }

  function finishSoundItem(correct){
    registerResult(item.id, correct);
    if(correct){ sessionState.correctCount++; removeFromReview(item.id); }
    else pushError(item.id,"pronunciation",item.cat,"CONNECTED_SPEECH", sessionState.multiSelected.join(", "), item.correct.join(", "));
    const fb = document.getElementById("fbArea");
    fb.innerHTML = '<div class="feedback '+(correct?'ok':'bad')+'">'+(correct?'✅ Correto!':'❌ Não foi dessa vez.')+' <div class="fb-line">💡 '+item.explain+'</div>'+(!correct?'<span class="tag">CONNECTED_SPEECH</span>':'')+'</div>';
    const btnRow=document.createElement("div"); btnRow.className="btn-row";
    btnRow.innerHTML='<button class="btn btn-primary" id="slNext">Próximo ▶</button>';
    fb.appendChild(btnRow);
    document.getElementById("slNext").addEventListener("click", function(){
      sessionState.idx++; sessionState.currentOptions=null; sessionState.multiSelected=[];
      render();
    });
  }
}

  const categories = ["All","Phrases","Collocations","Connected Speech","Profiles","My Vocabulary"];
  const catRow = document.getElementById("catCatRow");
  categories.forEach(function(c){
    const chip = document.createElement("button");
    chip.className = "chip" + (sessionState.catalogCategory===c ? " active":"");
    chip.textContent = c==="All" ? "All" : c;
    chip.addEventListener("click", function(){ sessionState.catalogCategory=c; render(); });
    catRow.appendChild(chip);
  });
  const favChip = document.createElement("button");
  favChip.className = "chip" + (sessionState.catalogFavOnly ? " active":"");
  favChip.textContent = "⭐ Favorites";
  favChip.addEventListener("click", function(){ sessionState.catalogFavOnly = !sessionState.catalogFavOnly; render(); });
  catRow.appendChild(favChip);

  const queryInput = document.getElementById("catQuery");
  queryInput.value = sessionState.catalogQuery || "";
  queryInput.addEventListener("input", function(){ sessionState.catalogQuery = queryInput.value; renderList(); });

  document.getElementById("addTermBtn").addEventListener("click", function(){
    const formArea = document.getElementById("addTermForm");
    formArea.innerHTML = `
      <div class="field-group"><span class="field-label">Inglês (frase/termo) *</span><input class="type-input" id="f_en"></div>
      <div class="field-group"><span class="field-label">Português (tradução) *</span><input class="type-input" id="f_pt"></div>
      <div class="btn-row"><button class="btn btn-primary" id="saveTermBtn">Salvar</button><button class="btn btn-ghost" id="cancelTermBtn">Cancelar</button></div>
    `;
    document.getElementById("saveTermBtn").addEventListener("click", function(){
      const en = document.getElementById("f_en").value.trim();
      const pt = document.getElementById("f_pt").value.trim();
      if(!en || !pt){ alert("Preencha inglês e português."); return; }
      state.customContent.push({id:"custom-"+Date.now(), en:en, pt:pt});
      saveState();
      render();
    });
    document.getElementById("cancelTermBtn").addEventListener("click", function(){ formArea.innerHTML=""; });
  });

  renderList();
  function renderList(){
    const box = document.getElementById("catList");
    const q = normalize(sessionState.catalogQuery);
    let items = buildCatalogItems();
    items = items.filter(function(it){
      if(sessionState.catalogCategory!=="All" && it.cat!==sessionState.catalogCategory) return false;
      if(sessionState.catalogFavOnly && !isFav(it.id)) return false;
      if(q && normalize(it.en).indexOf(q)===-1 && normalize(it.pt).indexOf(q)===-1) return false;
      return true;
    });
    if(items.length===0){ box.innerHTML = '<div class="empty-state"><div class="big">📭</div>Nenhum item encontrado com esses filtros.</div>'; return; }
    box.innerHTML = items.map(function(it){
      const expanded = !!sessionState.catalogExpanded[it.id];
      return `<div class="cat-item">
        <div class="cat-item-head expandable-card" data-headtoggle="${it.id}">
          <div class="ci-text"><div class="ci-en">${it.en}</div><div class="ci-pt">${it.pt}</div></div>
          <div class="cat-item-actions">
            <span class="tag">${it.cat}</span>
            <button class="icon-btn star ${isFav(it.id)?'active':''}" data-favtoggle="${it.id}">${isFav(it.id)?'⭐':'☆'}</button>
            <span class="expand-hint"><span class="expand-chevron ${expanded?'open':''}">▼</span></span>
          </div>
        </div>
        <div class="cat-item-body ${expanded?'open':''}">
          ${audioBtn(it.en)}
          ${it.example ? '<div class="arrow-line">→ '+it.example+(it.examplePt?' <span class="pt-line">('+it.examplePt+')</span>':'')+'</div>' : ''}
          ${it.note ? '<div class="arrow-line">💡 '+it.note+'</div>' : ''}
          ${!it.example && !it.note ? '<div class="pt-line">Sem detalhes adicionais para este item.</div>' : ''}
        </div>
      </div>`;
    }).join("");
    wireAudioButtons(box);
    box.querySelectorAll("[data-favtoggle]").forEach(function(b){
      b.addEventListener("click", function(e){ e.stopPropagation(); toggleFavorite(b.dataset.favtoggle); renderList(); updateHeader(); });
    });
    box.querySelectorAll("[data-headtoggle]").forEach(function(head){
      head.addEventListener("click", function(e){
        if(e.target.closest("[data-favtoggle]") || e.target.closest("[data-speak]")) return;
        const id = head.dataset.headtoggle;
        sessionState.catalogExpanded[id] = !sessionState.catalogExpanded[id];
        renderList();
      });
    });
  }
}

const SKILL_INFO = {
  QUESTION_ORDER: {what:"É a ordem correta das palavras ao formar perguntas com o verbo be (ex.: “Where are you from?” em vez de “Where you are from?”).",
    why:"Na Unit 1 quase toda a comunicação depende de perguntas pessoais (nome, idade, origem). Errar a ordem torna a pergunta incompreensível para um falante nativo.",
    tip:"Lembre-se: em perguntas com be, o verbo vem ANTES do sujeito — “Where + are + you + from?”. Pratique no módulo Asking Questions."},
  VOCABULARY: {what:"Reconhecimento e uso correto de palavras e informações específicas (nomes, países, profissões, etc.).",
    why:"Confundir um dado (ex.: “Alexander” em vez de “Alexandra”) muda o sentido da apresentação e pode gerar mal-entendidos reais.",
    tip:"Releia o diálogo com atenção antes de preencher os campos no módulo Introducing Others."},
  SOCIAL_RESPONSE: {what:"Saber reagir de forma apropriada a saudações, convites, despedidas e confirmações do dia a dia.",
    why:"São as respostas mais usadas em conversas reais e casuais — dominar essas fórmulas prontas dá fluência imediata.",
    tip:"Memorize as Golden Phrases (“Pretty good, thanks.”, “Sure, I'd love some.”) no módulo Essential Phrases antes de praticar Keep the Conversation Going."},
  LISTENING: {what:"Capacidade de capturar informações específicas (nomes, países, idades) a partir de um áudio.",
    why:"Em uma conversa real você não tem texto escrito — só o que ouve. Esse é o teste mais próximo de uma situação autêntica.",
    tip:"Ouça o áudio quantas vezes precisar no módulo Listening for Details e escreva exatamente o que você ouviu, sem adivinhar."},
  SPELLING: {what:"Pedir e fornecer a soletração correta de nomes e palavras em inglês.",
    why:"Nomes próprios não têm tradução — a única forma de garantir que foram entendidos corretamente é soletrando.",
    tip:"Pratique a pergunta “How do you spell that?” e responda soletrando letra por letra, como no módulo Clarifying & Repairing."},
  CONNECTED_SPEECH: {what:"Como as palavras se conectam na fala natural em inglês (linking, flap T, silent e).",
    why:"Sem entender essas conexões, um inglês falado naturalmente soa muito mais rápido e confuso do que o inglês “separado” dos livros.",
    tip:"Treine o ouvido no módulo Pronunciation & Linking, prestando atenção em como o final de uma palavra “gruda” no início da próxima."}
};
function renderPerformance(el){
  el.appendChild(backBar("Voltar ao Início", goHub));
  const st = computeStats();
  const skillTags = ["QUESTION_ORDER","VOCABULARY","SOCIAL_RESPONSE","LISTENING","SPELLING","CONNECTED_SPEECH"];
  const counts = {};
  skillTags.forEach(function(t){ counts[t]=0; });
  state.errors.forEach(function(e){ if(counts[e.errorType]!==undefined) counts[e.errorType]++; });
  const weakest = Object.entries(counts).sort(function(a,b){ return b[1]-a[1]; })[0];
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="module-title">📊 Desempenho &amp; Habilidades</div>
    <div class="module-desc">Seu progresso geral nesta unidade.</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${st.accuracy}%</div><div class="stat-label">Accuracy</div></div>
      <div class="stat-card"><div class="stat-num">${state.xp}</div><div class="stat-label">XP total</div></div>
      <div class="stat-card"><div class="stat-num">${overallProgress()}%</div><div class="stat-label">Progresso da unidade</div></div>
      <div class="stat-card"><div class="stat-num">${state.reviewQueue.length}</div><div class="stat-label">Review queue</div></div>
      <div class="stat-card"><div class="stat-num">${state.bestStreak}</div><div class="stat-label">Best streak</div></div>
      <div class="stat-card"><div class="stat-num">${state.favorites.length}</div><div class="stat-label">⭐ Favorites</div></div>
    </div>
    <div class="module-desc" style="margin-top:18px;"><b>Habilidades (baseado em erros recentes)</b>${weakest && weakest[1]>0 ? ` — precisa mais atenção: <b>${weakest[0]}</b>` : " — nenhum erro recente registrado 🎉"}</div>
    <div id="skillCards"></div>
    <div class="module-desc" style="margin-top:18px;"><b>Erros recentes</b></div>
    <div id="recentErrors"></div>
  `;
  el.appendChild(wrap);
  if(!sessionState.perfExpanded) sessionState.perfExpanded = {};
  renderSkillCards();
  function renderSkillCards(){
    const box = document.getElementById("skillCards");
    const shown = skillTags.filter(function(t){ return counts[t]>0; });
    if(shown.length===0){ box.innerHTML = ""; return; }
    box.innerHTML = shown.map(function(t){
      const expanded = !!sessionState.perfExpanded[t];
      const info = SKILL_INFO[t] || {};
      return `<div class="skill-card">
        <div class="skill-card-head expandable-card" data-skilltoggle="${t}">
          <div style="flex:1;">
            <span class="field-label" style="margin-bottom:0;">${t} — ${counts[t]} erro(s)</span>
            <div class="mini-bar"><div style="width:${Math.min(100,counts[t]*20)}%"></div></div>
          </div>
          <span class="expand-hint">ℹ️ Dicas <span class="expand-chevron ${expanded?'open':''}">▼</span></span>
        </div>
        <div class="skill-card-body ${expanded?'open':''}">
          <div class="fb-line"><b>O que é:</b> ${info.what||""}</div>
          <div class="fb-line"><b>Por que importa:</b> ${info.why||""}</div>
          <div class="fb-line"><b>💡 Dica prática:</b> ${info.tip||""}</div>
        </div>
      </div>`;
    }).join("");
    box.querySelectorAll("[data-skilltoggle]").forEach(function(h){
      h.addEventListener("click", function(){
        const t = h.dataset.skilltoggle;
        sessionState.perfExpanded[t] = !sessionState.perfExpanded[t];
        renderSkillCards();
      });
    });
  }
  const box = document.getElementById("recentErrors");
  if(state.errors.length===0){ box.innerHTML = '<div class="empty-state"><div class="big">🎉</div>Nenhum erro registrado ainda.</div>'; return; }
  box.innerHTML = state.errors.slice(0,10).map(function(e){
    return `<div class="review-item">
      <span class="tag">${e.errorType}</span>
      <div class="pt-line" style="margin-top:6px;">${e.label}</div>
      ${e.wrongText? '<div class="fb-line">❌ “'+e.wrongText+'”</div>':""}
      ${e.correctText? '<div class="fb-line">✅ “'+e.correctText+'”</div>':""}
    </div>`;
  }).join("");
}

/* =====================================================================
   INIT
   ===================================================================== */
render();
</script>
